<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MDraft RenderIR Export</title>
<style>
html,body{margin:0;min-height:100%;background:rgb(6,0,20);color:#eadfda;}
body{font-family:Consolas,'Cascadia Mono','Courier New',monospace;}
.render-root{box-sizing:border-box;min-height:100vh;padding:40px;background:radial-gradient(circle at 15% 5%,rgba(255,43,214,.28),transparent 28rem),radial-gradient(circle at 85% 10%,rgba(0,245,255,.20),transparent 24rem),linear-gradient(180deg,#060014,#090018 48%,#02030a);}
.render-frame{display:block;margin:0 auto;max-width:calc(100vw - 32px);height:auto;}
</style>
</head>
<body class="theme-cyberpunk">
<main class="render-root">
<svg class="render-frame" xmlns="http://www.w3.org/2000/svg" width="760" height="200" viewBox="0 0 760 200" role="img" aria-label="MDraft RenderIR Export">
<rect x="0" y="0" width="760" height="200" fill="rgb(10,0,28)" stroke="rgb(0,245,255)" stroke-width="1"/>
<rect x="0" y="0" width="760" height="32" fill="rgb(6,0,20)"/>
<rect x="0" y="24" width="760" height="1" fill="rgb(0,245,255)"/>
<text x="22" y="58" fill="rgb(232,251,255)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">abcd EXTERN</text>
</svg>
</main>
</body>
</html>
