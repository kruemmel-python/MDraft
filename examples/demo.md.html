<text x="32" y="11924" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">npm run build:web</text>
<text x="22" y="11976" fill="rgb(255,210,210)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="18" font-weight="700">Type-check</text>
<rect x="22" y="11994" width="716" height="34" fill="rgb(11,3,3)" stroke="rgb(208,215,222)" stroke-width="1"/>
<text x="32" y="12016" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">npx tsc --noEmit</text>
<text x="22" y="12068" fill="rgb(255,210,210)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="18" font-weight="700">Start Electron development mode</text>
<rect x="22" y="12086" width="716" height="34" fill="rgb(11,3,3)" stroke="rgb(208,215,222)" stroke-width="1"/>
<text x="32" y="12108" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">npm run electron:dev</text>
<text x="22" y="12160" fill="rgb(255,210,210)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="18" font-weight="700">Build desktop package</text>
<rect x="22" y="12178" width="716" height="34" fill="rgb(11,3,3)" stroke="rgb(208,215,222)" stroke-width="1"/>
<text x="32" y="12200" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">npm run electron:build</text>
<line x1="22" y1="12242" x2="738" y2="12242" stroke="rgb(208,215,222)" stroke-width="1"/>
<text x="22" y="12284" fill="rgb(255,232,226)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="20" font-weight="700">CLI usage</text>
<line x1="22" y1="12294" x2="738" y2="12294" stroke="rgb(208,215,222)" stroke-width="1"/>
<text x="22" y="12330" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">CodeDumper includes a headless CLI for automation and CI pipelines.</text>
<text x="22" y="12368" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">Basic usage:</text>
<rect x="22" y="12390" width="716" height="34" fill="rgb(11,3,3)" stroke="rgb(208,215,222)" stroke-width="1"/>
<text x="32" y="12412" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">npm run cli -- project.zip codedump.md</text>
<text x="22" y="12462" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">With token chunking:</text>
<rect x="22" y="12484" width="716" height="34" fill="rgb(11,3,3)" stroke="rgb(208,215,222)" stroke-width="1"/>
<text x="32" y="12506" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">npm run cli -- project.zip codedump.md --max-tokens 120000</text>
<text x="22" y="12556" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">With review focus paths:</text>
<rect x="22" y="12578" width="716" height="34" fill="rgb(11,3,3)" stroke="rgb(208,215,222)" stroke-width="1"/>
<text x="32" y="12600" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">npm run cli -- project.zip codedump.md --focus src/auth.ts,src/auth.test.ts</text>
<text x="22" y="12650" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">With a newline-separated or diff-derived focus list:</text>
<rect x="22" y="12672" width="716" height="34" fill="rgb(11,3,3)" stroke="rgb(208,215,222)" stroke-width="1"/>
<text x="32" y="12694" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">npm run cli -- project.zip codedump.md --focus-file changed-files.txt</text>
<text x="22" y="12744" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">With a patch file:</text>
<rect x="22" y="12766" width="716" height="34" fill="rgb(11,3,3)" stroke="rgb(208,215,222)" stroke-width="1"/>
<text x="32" y="12788" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">npm run cli -- project.zip codedump.md --focus-from-patch pr-123.patch</text>
<text x="22" y="12838" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">With custom enterprise rules:</text>
<rect x="22" y="12860" width="716" height="34" fill="rgb(11,3,3)" stroke="rgb(208,215,222)" stroke-width="1"/>
<text x="32" y="12882" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">npm run cli -- project.zip codedump.md --custom-rules rules.json</text>
<text x="22" y="12932" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">With skeleton condensation:</text>
<rect x="22" y="12954" width="716" height="34" fill="rgb(11,3,3)" stroke="rgb(208,215,222)" stroke-width="1"/>
<text x="32" y="12976" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">npm run cli -- project.zip codedump.md --ast-mode skeleton</text>
<text x="22" y="13026" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">Recommended CI mode:</text>
<rect x="22" y="13048" width="716" height="34" fill="rgb(11,3,3)" stroke="rgb(208,215,222)" stroke-width="1"/>
<text x="32" y="13070" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">npm run cli -- repository.zip codedump.md --llm-code-review --semantic-chunking </text>
<line x1="22" y1="13112" x2="738" y2="13112" stroke="rgb(208,215,222)" stroke-width="1"/>
<text x="22" y="13154" fill="rgb(255,232,226)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="20" font-weight="700">GitHub Action usage</text>
<line x1="22" y1="13164" x2="738" y2="13164" stroke="rgb(208,215,222)" stroke-width="1"/>
<text x="22" y="13200" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">The repository includes a local GitHub Action and workflow template for</text>
<text x="22" y="13224" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">producing LLM-ready review artifacts in CI.</text>
<text x="22" y="13262" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">Example workflow behavior:</text>
<text x="22" y="13300" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">1. checkout repository 2. package repository as ZIP 3. run CodeDumper</text>
<text x="22" y="13324" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">CLI 4. upload generated dump as workflow artifact</text>
<text x="22" y="13362" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">Typical usage:</text>
<rect x="22" y="13384" width="716" height="584" fill="rgb(11,3,3)" stroke="rgb(208,215,222)" stroke-width="1"/>
<text x="32" y="13406" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">name: CodeDump Review Artifact</text>
<text x="32" y="13428" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14"></text>
<text x="32" y="13450" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">on:</text>
<text x="32" y="13472" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">  pull_request:</text>
<text x="32" y="13494" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">  workflow_dispatch:</text>
<text x="32" y="13516" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14"></text>
<text x="32" y="13538" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">jobs:</text>
<text x="32" y="13560" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">  codedump:</text>
<text x="32" y="13582" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">    runs-on: ubuntu-latest</text>
<text x="32" y="13604" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">    steps:</text>
<text x="32" y="13626" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">      - uses: actions/checkout@v4</text>
<text x="32" y="13648" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14"></text>
<text x="32" y="13670" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">      - uses: actions/setup-node@v4</text>
<text x="32" y="13692" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">        with:</text>
<text x="32" y="13714" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">          node-version: 20</text>
<text x="32" y="13736" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14"></text>
<text x="32" y="13758" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">      - run: npm ci</text>
<text x="32" y="13780" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14"></text>
<text x="32" y="13802" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">      - run: zip -r repository.zip . -x &quot;node_modules/*&quot; &quot;dist/*&quot; &quot;.git/*&quot;</text>
<text x="32" y="13824" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14"></text>
<text x="32" y="13846" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">      - run: npm run cli -- repository.zip codedump.md --llm-code-review --max-t</text>
<text x="32" y="13868" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14"></text>
<text x="32" y="13890" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">      - uses: actions/upload-artifact@v4</text>
<text x="32" y="13912" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">        with:</text>
<text x="32" y="13934" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">          name: llm-code-review-dump</text>
<text x="32" y="13956" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">          path: codedump.md</text>
<line x1="22" y1="13998" x2="738" y2="13998" stroke="rgb(208,215,222)" stroke-width="1"/>
<text x="22" y="14044" fill="rgb(255,210,210)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="18" font-weight="700">LM Studio on localhost or LAN</text>
<text x="22" y="14078" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">The Local LLM Panel accepts either a server base URL or a full</text>
<text x="22" y="14102" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">chat-completions endpoint.</text>
<text x="22" y="14140" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">Examples:</text>
<rect x="22" y="14162" width="716" height="100" fill="rgb(11,3,3)" stroke="rgb(208,215,222)" stroke-width="1"/>
<text x="32" y="14184" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">http://localhost:1234</text>
<text x="32" y="14206" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">http://localhost:1234/v1/chat/completions</text>
<text x="32" y="14228" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">http://192.168.178.62:1234</text>
<text x="32" y="14250" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">http://192.168.178.62:1234/v1/chat/completions</text>
<text x="22" y="14300" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">For LM Studio:</text>
<text x="22" y="14338" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">1. Start the LM Studio local server. 2. Load a model in LM Studio. 3.</text>
<text x="22" y="14362" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">Enable LAN access / bind to all interfaces if CodeDumper runs on</text>
<text x="22" y="14386" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">another device. 4. Allow port 1234 in the firewall. 5. In CodeDumper,</text>
<text x="22" y="14410" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">choose OpenAI-compatible / LM Studio. 6. Click Load models or enter the</text>
<text x="22" y="14434" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">exact running model name manually. 7. Send the dump.</text>
<text x="22" y="14472" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">If the browser shows Failed to fetch, the problem is usually one of</text>
<text x="22" y="14496" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">these:</text>
<text x="40" y="14534" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• the LM Studio server is not running</text>
<text x="40" y="14566" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• the URL is missing the correct host or port</text>
<text x="40" y="14598" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• the server is bound only to localhost, but CodeDumper is using a</text>
<text x="40" y="14622" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">LAN IP</text>
<text x="40" y="14654" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• the firewall blocks port 1234</text>
<text x="40" y="14686" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• the server rejects browser CORS requests</text>
<text x="22" y="14724" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">A quick check is to open this URL directly in the browser:</text>
<rect x="22" y="14746" width="716" height="34" fill="rgb(11,3,3)" stroke="rgb(208,215,222)" stroke-width="1"/>
<text x="32" y="14768" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">http://192.168.178.62:1234/v1/models</text>
<text x="22" y="14818" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">If that works in a browser tab but the panel still cannot fetch it, use</text>
<text x="22" y="14842" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">the Electron app or enable CORS support in the local server.</text>
<line x1="22" y1="14872" x2="738" y2="14872" stroke="rgb(208,215,222)" stroke-width="1"/>
<text x="22" y="14914" fill="rgb(255,232,226)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="20" font-weight="700">Recommended LLM workflow</text>
<line x1="22" y1="14924" x2="738" y2="14924" stroke="rgb(208,215,222)" stroke-width="1"/>
<text x="22" y="14960" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">For a full repository review:</text>
<text x="22" y="14998" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">1. Enable LLM Code Review Mode. 2. Keep secret scanning enabled. 3.</text>
<text x="22" y="15022" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">Keep prompt-injection scanning enabled for untrusted repositories. 4.</text>
<text x="22" y="15046" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">Exclude generated data, reports, binaries, and lockfiles. 5. Use</text>
<text x="22" y="15070" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">semantic chunking when the output exceeds the target model context</text>
<text x="22" y="15094" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">window. 6. Review warnings before sending any dump to an external</text>
<text x="22" y="15118" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">system.</text>
<text x="22" y="15156" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">For pull-request review:</text>
<text x="22" y="15194" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">1. Enable Diff / Review Focus Mode. 2. Provide changed file paths or a</text>
<text x="22" y="15218" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">unified diff. 3. Include nearby tests and companions. 4. Generate a</text>
<text x="22" y="15242" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">compact review dump. 5. Send only the focused dump to the LLM.</text>
<line x1="22" y1="15272" x2="738" y2="15272" stroke="rgb(208,215,222)" stroke-width="1"/>
<text x="22" y="15314" fill="rgb(255,232,226)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="20" font-weight="700">What should not be included in an LLM code dump</text>
<line x1="22" y1="15324" x2="738" y2="15324" stroke="rgb(208,215,222)" stroke-width="1"/>
<text x="22" y="15360" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">CodeDumper is intentionally aggressive about excluding low-value or</text>
<text x="22" y="15384" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">risky material.</text>
<text x="22" y="15422" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">Usually exclude:</text>
<rect x="22" y="15444" width="716" height="430" fill="rgb(11,3,3)" stroke="rgb(208,215,222)" stroke-width="1"/>
<text x="32" y="15466" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">node_modules/**</text>
<text x="32" y="15488" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">dist/**</text>
<text x="32" y="15510" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">build/**</text>
<text x="32" y="15532" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">release/**</text>
<text x="32" y="15554" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">coverage/**</text>
<text x="32" y="15576" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">reports/**</text>
<text x="32" y="15598" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">data/**</text>
<text x="32" y="15620" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">.git/**</text>
<text x="32" y="15642" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">*.lock</text>
<text x="32" y="15664" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">package-lock.json</text>
<text x="32" y="15686" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">yarn.lock</text>
<text x="32" y="15708" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">pnpm-lock.yaml</text>
<text x="32" y="15730" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">*.map</text>
<text x="32" y="15752" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">*.log</text>
<text x="32" y="15774" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">*.min.js</text>
<text x="32" y="15796" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">*.pem</text>
<text x="32" y="15818" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">*.key</text>
<text x="32" y="15840" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">.env</text>
<text x="32" y="15862" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">.env.*</text>
<text x="22" y="15912" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">Usually include:</text>
<rect x="22" y="15934" width="716" height="584" fill="rgb(11,3,3)" stroke="rgb(208,215,222)" stroke-width="1"/>
<text x="32" y="15956" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">src/**</text>
<text x="32" y="15978" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">app/**</text>
<text x="32" y="16000" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">lib/**</text>
<text x="32" y="16022" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">server/**</text>
<text x="32" y="16044" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">client/**</text>

<line x1="22" y1="16548" x2="738" y2="16548" stroke="rgb(208,215,222)" stroke-width="1"/>
<text x="22" y="16590" fill="rgb(255,232,226)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="20" font-weight="700">Privacy model</text>
<line x1="22" y1="16600" x2="738" y2="16600" stroke="rgb(208,215,222)" stroke-width="1"/>
<text x="22" y="16636" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">CodeDumper is a local processing tool. By design:</text>
<text x="40" y="16674" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• uploaded ZIP files are processed locally</text>
<text x="40" y="16706" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• no LLM provider is contacted</text>
<text x="40" y="16738" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• no project data is uploaded by the app during dump generation</text>
<text x="40" y="16770" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• token and cost estimates are calculated offline</text>
<text x="40" y="16802" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• users remain responsible for where they later paste, upload, or</text>
<text x="40" y="16826" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">send the generated dump</text>
<line x1="22" y1="16856" x2="738" y2="16856" stroke="rgb(208,215,222)" stroke-width="1"/>
<text x="22" y="16898" fill="rgb(255,232,226)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="20" font-weight="700">Limitations</text>
<line x1="22" y1="16908" x2="738" y2="16908" stroke="rgb(208,215,222)" stroke-width="1"/>
<text x="22" y="16944" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">CodeDumper reduces risk, but it cannot guarantee that every sensitive</text>
<text x="22" y="16968" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">value or malicious instruction will be detected.</text>
<text x="22" y="17006" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">Known limitations:</text>
<text x="40" y="17044" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• entropy scanning can produce false positives</text>
<text x="40" y="17076" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• prompt-injection phrase matching can miss novel attacks</text>
<text x="40" y="17108" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• entropy scanning can redact harmless high-randomness identifiers</text>
<text x="40" y="17140" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• prompt-injection phrase matching can miss novel attacks</text>
<text x="40" y="17172" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• code condensation may remove comments that are semantically</text>
<text x="40" y="17196" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">useful</text>
<text x="40" y="17228" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• skeleton mode is structural and may omit implementation details</text>
<text x="40" y="17252" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">required for deep debugging</text>
<text x="40" y="17284" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• semantic chunking is heuristic and not a full dependency graph</text>
<text x="40" y="17308" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">for every language</text>
<text x="40" y="17340" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• local LLM handoff depends on the local model server and its</text>
<text x="40" y="17364" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">context-window limits</text>
<text x="40" y="17396" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• archive parsing is hardened but adversarial file formats are</text>
<text x="40" y="17420" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">inherently risky</text>
<text x="40" y="17452" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• generated dumps should still be reviewed before being shared</text>
<text x="40" y="17476" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">externally</text>
<line x1="22" y1="17506" x2="738" y2="17506" stroke="rgb(208,215,222)" stroke-width="1"/>
<text x="22" y="17548" fill="rgb(255,232,226)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="20" font-weight="700">Enterprise hardening checklist</text>
<line x1="22" y1="17558" x2="738" y2="17558" stroke="rgb(208,215,222)" stroke-width="1"/>
<text x="22" y="17594" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">Before using CodeDumper in a regulated or high-sensitivity environment:</text>
<text x="40" y="17632" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• run dependency audit in your own supply-chain environment</text>
<text x="40" y="17664" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• pin Node.js and npm versions in CI</text>
<text x="40" y="17696" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• review Electron build and signing configuration</text>
<text x="40" y="17728" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• enforce internal allowlists for export destinations</text>
<text x="40" y="17760" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• keep secret scanning enabled by default</text>
<text x="40" y="17792" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• keep prompt-injection scanning enabled for third-party code</text>
<text x="40" y="17824" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• set conservative token and size limits</text>
<text x="40" y="17856" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• store generated dumps as sensitive artifacts</text>
<text x="40" y="17888" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• avoid sending proprietary code to external LLM providers unless</text>
<text x="40" y="17912" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">approved by policy</text>
