<text x="22" y="66" fill="rgb(255,241,238)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="24" font-weight="700">CodeDumper</text>
<line x1="22" y1="76" x2="738" y2="76" stroke="rgb(208,215,222)" stroke-width="1"/>
<text x="22" y="114" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">Enterprise-grade local code dump generator for LLM-assisted code</text>
<text x="22" y="138" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">review, audits, architecture analysis, and secure repository handoff.</text>
<text x="22" y="176" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">CodeDumper converts project ZIP archives into structured, LLM-ready</text>
<text x="22" y="200" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">Markdown, XML, or JSON dumps. It is designed for developers, security</text>
<text x="22" y="224" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">teams, consultants, and engineering organizations that need precise</text>
<text x="22" y="248" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">control over what code is shared with humans or large language models.</text>
<text x="22" y="286" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">The application runs locally in the browser or as a hardened Electron</text>
<text x="22" y="310" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">desktop app. No LLM call is made during dump generation. Token counts</text>
<text x="22" y="334" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">and costs are offline estimates only.</text>
<line x1="22" y1="364" x2="738" y2="364" stroke="rgb(208,215,222)" stroke-width="1"/>
<text x="22" y="406" fill="rgb(255,232,226)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="20" font-weight="700">Why CodeDumper exists</text>
<line x1="22" y1="416" x2="738" y2="416" stroke="rgb(208,215,222)" stroke-width="1"/>
<text x="22" y="452" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">Large language models are useful for code review, migration planning,</text>
<text x="22" y="476" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">refactoring, security analysis, and architecture understanding.</text>
<text x="22" y="500" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">However, sending an entire repository directly to an LLM is usually</text>
<text x="22" y="524" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">inefficient and risky.</text>
<text x="22" y="562" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">Typical problems include:</text>
<text x="40" y="600" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• oversized prompts that exceed context windows</text>
<text x="40" y="632" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• accidental inclusion of node_modules, build output, lockfiles,</text>
<text x="40" y="656" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">reports, generated assets, or datasets</text>
<text x="40" y="688" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• leakage of .env files, API keys, tokens, SSH keys, or cloud</text>
<text x="40" y="712" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">credentials</text>
<text x="40" y="744" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• prompt-injection content hidden in comments, documentation, or</text>
<text x="40" y="768" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">third-party code</text>
<text x="40" y="800" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• poor file ordering that makes the repository harder for an LLM to</text>
<text x="40" y="824" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">understand</text>
<text x="40" y="856" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• browser freezes while processing large ZIP files</text>
<text x="40" y="888" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• unsafe ZIP handling, including path traversal and</text>
<text x="40" y="912" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">decompression-bomb risks</text>
<text x="22" y="950" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">CodeDumper solves these problems by producing curated, filtered,</text>
<text x="22" y="974" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">token-aware, security-scanned code dumps.</text>
<line x1="22" y1="1004" x2="738" y2="1004" stroke="rgb(208,215,222)" stroke-width="1"/>
<text x="22" y="1046" fill="rgb(255,232,226)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="20" font-weight="700">Core capabilities</text>
<line x1="22" y1="1056" x2="738" y2="1056" stroke="rgb(208,215,222)" stroke-width="1"/>
<text x="22" y="1094" fill="rgb(255,210,210)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="18" font-weight="700">LLM Code Review Mode</text>
<text x="22" y="1128" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">The default enterprise workflow is LLM Code Review Mode. It is</text>
<text x="22" y="1152" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">language-agnostic and optimized for repositories of many technology</text>
<text x="22" y="1176" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">stacks, not only React or JavaScript.</text>
<text x="22" y="1214" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">It prioritizes:</text>
<text x="40" y="1252" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• source code</text>
<text x="40" y="1284" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• tests</text>
<text x="40" y="1316" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• manifests</text>
<text x="40" y="1348" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• runtime and build configuration</text>
<text x="40" y="1380" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• architecture documentation</text>
<text x="40" y="1412" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• security boundaries</text>
<text x="40" y="1444" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• framework entry points</text>
<text x="22" y="1482" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">It automatically removes or deprioritizes:</text>
<text x="40" y="1520" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• dependency directories</text>
<text x="40" y="1552" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• lockfiles</text>
<text x="40" y="1584" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• build artifacts</text>
<text x="40" y="1616" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• release packages</text>
<text x="40" y="1648" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• reports</text>
<text x="40" y="1680" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• generated data</text>
<text x="40" y="1712" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• vendored code</text>
<text x="40" y="1744" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• minified bundles</text>
<text x="40" y="1776" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• sourcemaps</text>
<text x="40" y="1808" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• logs</text>
<text x="40" y="1840" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• binaries</text>
<text x="40" y="1872" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• local secret files</text>
<text x="22" y="1910" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">Supported ecosystems include, among others:</text>
<text x="40" y="1948" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• JavaScript / TypeScript / React / Vue / Svelte / Astro / Node.js</text>
<text x="40" y="1980" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• Python / FastAPI / Django / Flask / Streamlit</text>
<text x="40" y="2012" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• Rust</text>
<text x="40" y="2044" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• Go</text>
<text x="40" y="2076" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• Java / Kotlin / Scala</text>
<text x="40" y="2108" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• .NET / C#</text>
<text x="40" y="2140" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• C / C++</text>
<text x="40" y="2172" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• Swift</text>
<text x="40" y="2204" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• PHP</text>
<text x="40" y="2236" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• Ruby</text>
<text x="40" y="2268" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• Dart</text>
<text x="40" y="2300" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• Elixir / Erlang</text>
<text x="40" y="2332" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• Clojure</text>
<text x="40" y="2364" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• Haskell / OCaml</text>
<line x1="22" y1="2394" x2="738" y2="2394" stroke="rgb(208,215,222)" stroke-width="1"/>
<text x="22" y="2436" fill="rgb(255,232,226)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="20" font-weight="700">Feature overview</text>
<line x1="22" y1="2446" x2="738" y2="2446" stroke="rgb(208,215,222)" stroke-width="1"/>
<text x="22" y="2484" fill="rgb(255,210,210)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="18" font-weight="700">Local ZIP inspection</text>
<text x="22" y="2518" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">CodeDumper inspects uploaded ZIP archives locally. It reads the archive</text>
<text x="22" y="2542" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">structure, builds a file tree, applies safety limits, and lets the user</text>
<text x="22" y="2566" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">select or exclude files before generating a dump.</text>
<text x="22" y="2606" fill="rgb(255,210,210)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="18" font-weight="700">Interactive file tree</text>
<text x="22" y="2640" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">A visual tree selector provides fine-grained control over included and</text>
<text x="22" y="2664" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">excluded files. Directory selections cascade to children, allowing fast</text>
<text x="22" y="2688" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">cleanup of large repositories.</text>
<text x="22" y="2728" fill="rgb(255,210,210)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="18" font-weight="700">Native ignore-file support</text>
<text x="22" y="2762" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">CodeDumper automatically detects and applies ignore rules from:</text>
<text x="40" y="2800" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• .gitignore</text>
<text x="40" y="2832" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• .dockerignore</text>
<text x="22" y="2870" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">Negated ignore rules using !pattern are supported.</text>
<text x="22" y="2910" fill="rgb(255,210,210)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="18" font-weight="700">Smart stack detection</text>
<text x="22" y="2944" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">The scanner detects common project types from repository files and</text>
<text x="22" y="2968" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">applies appropriate filtering logic. Examples:</text>
<text x="40" y="3006" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• package.json + Vite config → Node / Vite / frontend project</text>
<text x="40" y="3038" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• pyproject.toml or requirements.txt → Python project</text>
<text x="40" y="3070" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• Cargo.toml → Rust crate</text>
<text x="40" y="3102" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• pom.xml → Java / Maven project</text>
<text x="40" y="3134" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• .csproj or .sln → .NET project</text>
<text x="22" y="3174" fill="rgb(255,210,210)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="18" font-weight="700">Repository map generation</text>
<text x="22" y="3208" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">Generated dumps include a repository map at the top. This gives humans</text>
<text x="22" y="3232" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">and LLMs an immediate overview of the included project structure before</text>
<text x="22" y="3256" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">the file contents begin.</text>
<text x="22" y="3302" fill="rgb(255,210,210)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="18" font-weight="700">Local LLM Panel for LM Studio, Ollama and OpenAI-compatible local servers</text>
<text x="22" y="3336" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">The web UI includes a visible Local LLM Panel in the output area after</text>
<text x="22" y="3360" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">a dump has been generated.</text>
<text x="22" y="3398" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">Typical LM Studio workflow:</text>
<text x="22" y="3436" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">1. Start LM Studio. 2. Load and start a local model. 3. Enable the</text>
<text x="22" y="3460" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">local server in LM Studio. 4. In CodeDumper, open the Local LLM Panel.</text>
<text x="22" y="3484" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">5. Select OpenAI-compatible / LM Studio. 6. Set the API endpoint to:</text>
<rect x="22" y="3506" width="716" height="34" fill="rgb(11,3,3)" stroke="rgb(208,215,222)" stroke-width="1"/>
<text x="32" y="3528" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">http://localhost:1234/v1/chat/completions</text>
<text x="22" y="3578" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">7. Click Load models or enter the running model name manually. 8.</text>
<text x="22" y="3602" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">Review or customize the system prompt and review prompt. 9. Click Send</text>
<text x="22" y="3626" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">dump to Local LLM.</text>
<text x="22" y="3664" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">For Ollama, use one of these endpoints:</text>
<rect x="22" y="3686" width="716" height="56" fill="rgb(11,3,3)" stroke="rgb(208,215,222)" stroke-width="1"/>
<text x="32" y="3708" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">http://localhost:11434/api/chat</text>
<text x="32" y="3730" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">http://localhost:11434/api/generate</text>
<text x="22" y="3780" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">The panel supports streaming responses and keeps the workflow local as</text>
<text x="22" y="3804" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">long as the configured endpoint points to localhost, 127.0.0.1, or</text>
<text x="22" y="3828" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">another trusted internal server.</text>
<text x="22" y="3868" fill="rgb(255,210,210)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="18" font-weight="700">Token counting and cost estimation</text>
<text x="22" y="3902" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">CodeDumper estimates token usage and optional API cost before export.</text>
<text x="22" y="3940" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">The UI explicitly states that no LLM/API call was made. Token and cost</text>
<text x="22" y="3964" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">values are offline estimates intended for planning context-window and</text>
<text x="22" y="3988" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">API-budget usage.</text>
<text x="22" y="4028" fill="rgb(255,210,210)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="18" font-weight="700">Multiple export formats</text>
<text x="22" y="4062" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">Supported output formats:</text>
<text x="40" y="4100" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• Markdown</text>
<text x="40" y="4132" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• XML</text>
<text x="40" y="4164" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• JSON</text>
<text x="22" y="4202" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">Markdown is suitable for general LLM workflows. XML and JSON are useful</text>
<text x="22" y="4226" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">for structured prompting pipelines and automated processing.</text>
<text x="22" y="4266" fill="rgb(255,210,210)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="18" font-weight="700">Chunked export</text>
<text x="22" y="4300" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">Large repositories can be split into multiple output parts using a</text>
<text x="22" y="4324" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">configurable token limit per file. This helps fit dumps into smaller</text>
<text x="22" y="4348" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">context windows.</text>
<text x="22" y="4388" fill="rgb(255,210,210)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="18" font-weight="700">Semantic chunking</text>
<text x="22" y="4422" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">Instead of splitting files purely linearly, CodeDumper can group</text>
<text x="22" y="4446" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">related files together. It prefers keeping files from the same</text>
<text x="22" y="4470" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">directory, matching base names, and test/spec companions in the same</text>
<text x="22" y="4494" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">chunk where possible.</text>
<text x="22" y="4532" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">Example:</text>
<rect x="22" y="4554" width="716" height="78" fill="rgb(11,3,3)" stroke="rgb(208,215,222)" stroke-width="1"/>
<text x="32" y="4576" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">Button.tsx</text>
<text x="32" y="4598" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">Button.test.tsx</text>
<text x="32" y="4620" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">Button.css</text>
<text x="22" y="4670" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">are more likely to stay together in the same export part.</text>
<text x="22" y="4710" fill="rgb(255,210,210)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="18" font-weight="700">Diff / Review Focus Mode</text>
<text x="22" y="4744" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">For pull-request-style workflows, CodeDumper can focus the dump on</text>
<text x="22" y="4768" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">changed files and nearby companions.</text>
<text x="22" y="4806" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">Users may provide:</text>
<text x="40" y="4844" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• a comma-separated list of changed paths</text>
<text x="40" y="4876" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• newline-separated changed paths</text>
<text x="40" y="4908" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• unified diff headers</text>
<text x="40" y="4940" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• uploaded .diff or .patch files</text>
<text x="22" y="4978" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">The dump is then narrowed to the most relevant review files plus</text>
<text x="22" y="5002" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">related tests or companions.</text>
<text x="22" y="5042" fill="rgb(255,210,210)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="18" font-weight="700">Code condensation</text>
<text x="22" y="5076" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">Optional code condensation reduces token footprint by removing</text>
<text x="22" y="5100" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">low-value whitespace and comments. This is useful when repository size</text>
<text x="22" y="5124" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">is more important than preserving every comment.</text>
<text x="22" y="5162" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">Because comments can contain architectural or security context, this</text>
<text x="22" y="5186" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">feature is optional.</text>
<text x="22" y="5226" fill="rgb(255,210,210)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="18" font-weight="700">Syntax-aware condensation and skeleton mode</text>
<text x="22" y="5260" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">CodeDumper includes a safer condensation path that avoids destructive</text>
<text x="22" y="5284" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">regex-based comment stripping for supported workflows. It can preserve</text>
<text x="22" y="5308" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">code structure while reducing prompt size.</text>
<text x="22" y="5346" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">The optional skeleton mode extracts compact structural context such as:</text>
<text x="40" y="5384" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• classes</text>
<text x="40" y="5416" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• functions</text>
<text x="40" y="5448" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• exported symbols</text>
<text x="40" y="5480" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• interfaces and types</text>
<text x="40" y="5512" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• route or module boundaries where detectable</text>
<text x="22" y="5550" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">This is useful when a model needs architectural context without every</text>
<text x="22" y="5574" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">implementation detail.</text>
<text x="22" y="5614" fill="rgb(255,210,210)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="18" font-weight="700">Token and file explorer</text>
<text x="22" y="5648" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">The output view includes a token/file explorer that helps identify</text>
<text x="22" y="5672" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">which folders or files dominate the generated context.</text>
<text x="22" y="5710" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">This makes it easier to remove accidental high-token areas such as:</text>
<text x="40" y="5748" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• fixtures</text>
<text x="40" y="5780" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• generated assets</text>
<text x="40" y="5812" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• large JSON files</text>
<text x="40" y="5844" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• reports</text>
<text x="40" y="5876" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• vendored code</text>
<text x="40" y="5908" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• test snapshots</text>
<text x="22" y="5946" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">Large token contributors can be excluded directly from the explorer</text>
<text x="22" y="5970" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">workflow.</text>
<text x="22" y="6010" fill="rgb(255,210,210)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="18" font-weight="700">Virtualized preview</text>
<text x="22" y="6044" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">Large generated dumps are previewed with a virtualized read-only output</text>
<text x="22" y="6068" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">view to avoid UI freezes caused by very large textareas.</text>
<text x="22" y="6108" fill="rgb(255,210,210)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="18" font-weight="700">Web Worker processing</text>
<text x="22" y="6142" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">ZIP processing, decoding, filtering, scanning, token counting, and dump</text>
<text x="22" y="6166" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">assembly run inside a Web Worker. The React UI remains responsive and</text>
<text x="22" y="6190" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">the job can be cancelled.</text>
<text x="22" y="6230" fill="rgb(255,210,210)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="18" font-weight="700">Push to Local LLM</text>
<text x="22" y="6264" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">CodeDumper can optionally send the generated dump to a local</text>
<text x="22" y="6288" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">LLM-compatible endpoint such as Ollama or LM Studio.</text>
<text x="22" y="6326" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">This keeps the workflow local-first while removing the need to copy</text>
<text x="22" y="6350" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">very large Markdown blocks manually.</text>
<text x="22" y="6388" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">Typical local endpoints include:</text>
<rect x="22" y="6410" width="716" height="56" fill="rgb(11,3,3)" stroke="rgb(208,215,222)" stroke-width="1"/>
<text x="32" y="6432" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">http://localhost:11434</text>
<text x="32" y="6454" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">http://127.0.0.1:1234</text>
<text x="22" y="6504" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">This feature is explicitly intended for local/private model workflows.</text>
<text x="22" y="6528" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">It is separate from the default dump generation flow, which still</text>
<text x="22" y="6552" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">performs no LLM/API call.</text>
<text x="22" y="6592" fill="rgb(255,210,210)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="18" font-weight="700">LM Studio browser compatibility</text>
<text x="22" y="6626" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">When the Web UI talks to LM Studio from http://localhost:3000, the</text>
<text x="22" y="6650" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">browser may perform a CORS preflight for JSON POST requests. PowerShell</text>
<text x="22" y="6674" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">or curl can succeed while the browser fails because they do not enforce</text>
<text x="22" y="6698" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">CORS.</text>
<text x="22" y="6736" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">CodeDumper therefore tries two transports for OpenAI-compatible LM</text>
<text x="22" y="6760" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">Studio endpoints:</text>
<text x="22" y="6798" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">1. standard application/json streaming request 2. no-preflight</text>
<text x="22" y="6822" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">text/plain;charset=UTF-8 JSON request for LM Studio/browser</text>
<text x="22" y="6846" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">compatibility</text>
<text x="22" y="6884" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">Use the LM Studio base URL, for example:</text>
<rect x="22" y="6906" width="716" height="34" fill="rgb(11,3,3)" stroke="rgb(208,215,222)" stroke-width="1"/>
<text x="32" y="6928" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">http://192.168.178.62:1234</text>
<text x="22" y="6978" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">CodeDumper resolves it internally to:</text>
<rect x="22" y="7000" width="716" height="34" fill="rgb(11,3,3)" stroke="rgb(208,215,222)" stroke-width="1"/>
<text x="32" y="7022" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">http://192.168.178.62:1234/v1/chat/completions</text>
<text x="22" y="7072" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">Keep CORS aktivieren and Im lokalen Netzwerk bereitstellen enabled in</text>
<text x="22" y="7096" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">LM Studio, then restart the local server.</text>
<text x="22" y="7136" fill="rgb(255,210,210)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="18" font-weight="700">Custom enterprise rules</text>
<text x="22" y="7170" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">Organizations can define custom security and prompt-injection rules as</text>
<text x="22" y="7194" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">JSON. This allows teams to detect internal credential formats,</text>
<text x="22" y="7218" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">proprietary token prefixes, or organization-specific LLM manipulation</text>
<text x="22" y="7242" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">patterns.</text>
<text x="22" y="7280" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">Example rule use cases:</text>
<text x="40" y="7318" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• CORP_API_TKN_</text>
<text x="40" y="7350" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• internal bearer-token formats</text>
<text x="40" y="7382" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• customer-specific environment variable names</text>
<text x="40" y="7414" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• prohibited prompt-injection phrases</text>
<text x="40" y="7446" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• compliance-specific redaction markers</text>
<line x1="22" y1="7476" x2="738" y2="7476" stroke="rgb(208,215,222)" stroke-width="1"/>
<text x="22" y="7518" fill="rgb(255,232,226)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="20" font-weight="700">Security features</text>
<line x1="22" y1="7528" x2="738" y2="7528" stroke="rgb(208,215,222)" stroke-width="1"/>
<text x="22" y="7564" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">CodeDumper is built for workflows where the output may later be shared</text>
<text x="22" y="7588" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">with an LLM, reviewer, vendor, or customer. Security checks are</text>
<text x="22" y="7612" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">therefore part of the core pipeline.</text>
<text x="22" y="7652" fill="rgb(255,210,210)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="18" font-weight="700">No API key leakage</text>
<text x="22" y="7686" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">The frontend does not embed server-side API keys. There is no static</text>
<text x="22" y="7710" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">injection of environment secrets into the browser bundle.</text>
<text x="22" y="7750" fill="rgb(255,210,210)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="18" font-weight="700">No LLM call during generation</text>
<text x="22" y="7784" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">CodeDumper does not send project contents to OpenAI, Anthropic, Google,</text>
<text x="22" y="7808" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">or any other model provider during dump creation. All processing is</text>
<text x="22" y="7832" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">local.</text>
<text x="22" y="7872" fill="rgb(255,210,210)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="18" font-weight="700">Secret and credential scanning</text>
<text x="22" y="7906" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">CodeDumper scans decoded text for common sensitive values and redacts</text>
<text x="22" y="7930" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">them before export.</text>
<text x="22" y="7968" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">Detection includes:</text>
<text x="40" y="8006" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• AWS access keys</text>
<text x="40" y="8038" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• OpenAI-style keys</text>
<text x="40" y="8070" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• GitHub tokens</text>
<text x="40" y="8102" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• Google API keys</text>
<text x="40" y="8134" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• private key blocks</text>
<text x="40" y="8166" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• bearer tokens</text>
<text x="40" y="8198" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• generic secret assignments</text>
<text x="40" y="8230" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• high-entropy token-like strings</text>
<text x="22" y="8268" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">Redactions are reported in the UI warning panel.</text>
<text x="22" y="8308" fill="rgb(255,210,210)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="18" font-weight="700">Shannon-entropy detection</text>
<text x="22" y="8342" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">In addition to fixed regex rules, CodeDumper can flag high-entropy</text>
<text x="22" y="8366" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">Base64-, hex-, and token-like strings. This helps catch custom</text>
<text x="22" y="8390" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">credentials and organization-specific secrets that do not match</text>
<text x="22" y="8414" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">standard patterns.</text>
<text x="22" y="8454" fill="rgb(255,210,210)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="18" font-weight="700">Prompt-injection detection</text>
<text x="22" y="8488" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">CodeDumper scans files for common indirect prompt-injection phrases,</text>
<text x="22" y="8512" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">such as attempts to override system instructions or manipulate</text>
<text x="22" y="8536" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">downstream LLM behavior.</text>
<text x="22" y="8574" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">Possible actions:</text>
<text x="40" y="8612" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• warn</text>
<text x="40" y="8644" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• redact</text>
<text x="40" y="8676" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• skip affected file</text>
<text x="22" y="8714" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">This is useful when analyzing third-party repositories or untrusted ZIP</text>
<text x="22" y="8738" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">archives.</text>
<text x="22" y="8778" fill="rgb(255,210,210)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="18" font-weight="700">Zip Slip protection</text>
<text x="22" y="8812" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">Archive paths are normalized and sanitized before they are displayed or</text>
<text x="22" y="8836" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">exported. Absolute paths, traversal segments, and unsafe path forms are</text>
<text x="22" y="8860" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">removed or rejected.</text>
<text x="22" y="8900" fill="rgb(255,210,210)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="18" font-weight="700">ZIP bomb and decompression protection</text>
<text x="22" y="8934" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">CodeDumper applies layered protections:</text>
<text x="40" y="8972" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• archive-level size limits</text>
<text x="40" y="9004" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• per-file size limits</text>
<text x="40" y="9036" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• file-count limits</text>
<text x="40" y="9068" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• path-length limits</text>
<text x="40" y="9100" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• compression-ratio checks</text>
<text x="40" y="9132" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• guarded extraction</text>
<text x="40" y="9164" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• running byte counters</text>
<text x="40" y="9196" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• Worker watchdog termination</text>
<text x="22" y="9234" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">Selected extraction paths use guarded streaming via fflate to reduce</text>
<text x="22" y="9258" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">memory-exhaustion risk compared with buffering entire files blindly.</text>
<text x="22" y="9298" fill="rgb(255,210,210)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="18" font-weight="700">Glob ReDoS protection</text>
<text x="22" y="9332" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">User-provided include and exclude patterns are validated and bounded to</text>
<text x="22" y="9356" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">reduce regular-expression denial-of-service risks caused by</text>
<text x="22" y="9380" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">pathological glob patterns.</text>
<text x="22" y="9420" fill="rgb(255,210,210)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="18" font-weight="700">Hardened Electron configuration</text>
<text x="22" y="9454" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">The Electron build is configured with a hardened browser environment:</text>
<text x="40" y="9492" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• nodeIntegration: false</text>
<text x="40" y="9524" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• contextIsolation: true</text>
<text x="40" y="9556" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• sandbox: true</text>
<text x="40" y="9588" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• webSecurity: true</text>
<text x="40" y="9620" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• denied permission requests</text>
<text x="40" y="9652" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• navigation restrictions</text>
<text x="40" y="9684" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• external window restrictions</text>
<text x="40" y="9716" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• Content Security Policy headers</text>
<text x="22" y="9756" fill="rgb(255,210,210)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="18" font-weight="700">ReDoS hardening</text>
<text x="22" y="9790" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">CodeDumper validates custom glob and regex-like rule inputs, applies</text>
<text x="22" y="9814" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">scan limits, and avoids unbounded high-risk text scans where possible.</text>
<text x="22" y="9838" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">Long lines and minified files are constrained before sensitive pattern</text>
<text x="22" y="9862" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">matching is performed.</text>
<text x="22" y="9902" fill="rgb(255,210,210)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="18" font-weight="700">Encoding and obfuscation hardening</text>
<text x="22" y="9936" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">Before prompt-injection and secret checks, text can be normalized using</text>
<text x="22" y="9960" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">Unicode NFKC. This reduces bypasses based on unusual Unicode forms.</text>
<text x="22" y="9998" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">The scanner also performs heuristic checks for suspicious</text>
<text x="22" y="10022" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">Base64-encoded strings and scans decoded candidates for secrets or</text>
<text x="22" y="10046" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">prompt-injection phrases.</text>
<text x="22" y="10086" fill="rgb(255,210,210)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="18" font-weight="700">Symlink and nested-archive protection</text>
<text x="22" y="10120" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">ZIP symlink entries are dropped to avoid unsafe path semantics in</text>
<text x="22" y="10144" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">browser, desktop, and CLI workflows.</text>
<text x="22" y="10182" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">Nested ZIP-like files are detected through magic bytes and treated as</text>
<text x="22" y="10206" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">non-recursive archive payloads. CodeDumper does not recursively unpack</text>
<text x="22" y="10230" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">archive-in-archive content by default.</text>
<line x1="22" y1="10260" x2="738" y2="10260" stroke="rgb(208,215,222)" stroke-width="1"/>
<text x="22" y="10302" fill="rgb(255,232,226)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="20" font-weight="700">Architecture</text>
<line x1="22" y1="10312" x2="738" y2="10312" stroke="rgb(208,215,222)" stroke-width="1"/>
<text x="22" y="10348" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">CodeDumper is structured around a browser-first React frontend and a</text>
<text x="22" y="10372" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">processing core that can be reused by desktop and CLI workflows.</text>
<rect x="22" y="10394" width="716" height="298" fill="rgb(11,3,3)" stroke="rgb(208,215,222)" stroke-width="1"/>
<text x="32" y="10416" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">.</text>
<text x="32" y="10438" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">├── src/</text>
<text x="32" y="10460" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">│   ├── components/          # UI components</text>
<text x="32" y="10482" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">│   ├── services/            # ZIP processing, filtering, tokenization, </text>
<text x="32" y="10504" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">│   ├── workers/             # Web Worker entry points</text>
<text x="32" y="10526" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">│   └── App.tsx              # Main application shell</text>
<text x="32" y="10548" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">├── electron/                # Hardened Electron main/preload code</text>
<text x="32" y="10570" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">├── cli/                     # Headless CLI entry point</text>
<text x="32" y="10592" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">├── .github/actions/         # GitHub Action definition</text>
<text x="32" y="10614" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">├── .github/workflows/       # CI example workflow</text>
<text x="32" y="10636" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">├── package.json</text>
<text x="32" y="10658" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">├── vite.config.ts</text>
<text x="32" y="10680" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">└── tsconfig.json</text>
<text x="22" y="10730" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">The core pipeline is approximately:</text>
<rect x="22" y="10752" width="716" height="430" fill="rgb(11,3,3)" stroke="rgb(208,215,222)" stroke-width="1"/>
<text x="32" y="10774" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">ZIP upload</text>
<text x="32" y="10796" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">  → archive inspection</text>
<text x="32" y="10818" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">  → path normalization</text>
<text x="32" y="10840" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">  → ignore-rule loading</text>
<text x="32" y="10862" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">  → stack detection</text>
<text x="32" y="10884" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">  → file tree selection</text>
<text x="32" y="10906" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">  → LLM Code Review filtering</text>
<text x="32" y="10928" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">  → guarded extraction</text>
<text x="32" y="10950" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">  → text decoding</text>
<text x="32" y="10972" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">  → Unicode normalization</text>
<text x="32" y="10994" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">  → secret scanning</text>
<text x="32" y="11016" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">  → high-entropy scanning</text>
<text x="32" y="11038" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">  → prompt-injection scanning</text>
<text x="32" y="11060" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">  → custom enterprise rules</text>
<text x="32" y="11082" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">  → optional condensation / skeletonization</text>
<text x="32" y="11104" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">  → token estimation</text>
<text x="32" y="11126" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">  → semantic chunking</text>
<text x="32" y="11148" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">  → Markdown/XML/JSON composition</text>
<text x="32" y="11170" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">  → token explorer / preview / download / local LLM handoff</text>
<line x1="22" y1="11212" x2="738" y2="11212" stroke="rgb(208,215,222)" stroke-width="1"/>
<text x="22" y="11254" fill="rgb(255,232,226)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="20" font-weight="700">Installation</text>
<line x1="22" y1="11264" x2="738" y2="11264" stroke="rgb(208,215,222)" stroke-width="1"/>
<text x="22" y="11302" fill="rgb(255,210,210)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="18" font-weight="700">Requirements</text>
<text x="40" y="11336" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• Node.js 20 LTS recommended</text>
<text x="40" y="11368" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• npm 10+</text>
<text x="40" y="11400" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">• Windows, macOS, or Linux</text>
<text x="22" y="11438" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">Electron installation requires access to Electron release downloads</text>
<text x="22" y="11462" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">during normal package installation.</text>
<text x="22" y="11502" fill="rgb(255,210,210)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="18" font-weight="700">Install dependencies</text>
<rect x="22" y="11520" width="716" height="34" fill="rgb(11,3,3)" stroke="rgb(208,215,222)" stroke-width="1"/>
<text x="32" y="11542" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">npm install</text>
<text x="22" y="11592" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">If package installation fails because of environment-specific Electron</text>
<text x="22" y="11616" fill="rgb(36,41,47)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="16">download restrictions, web-only verification can be performed with:</text>
<rect x="22" y="11638" width="716" height="34" fill="rgb(11,3,3)" stroke="rgb(208,215,222)" stroke-width="1"/>
<text x="32" y="11660" fill="rgb(255,214,207)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14">npm install --ignore-scripts</text>
<line x1="22" y1="11702" x2="738" y2="11702" stroke="rgb(208,215,222)" stroke-width="1"/>
<text x="22" y="11744" fill="rgb(255,232,226)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="20" font-weight="700">Development</text>
<line x1="22" y1="11754" x2="738" y2="11754" stroke="rgb(208,215,222)" stroke-width="1"/>
<text x="22" y="11792" fill="rgb(255,210,210)" font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="18" font-weight="700">Start the web app</text>
<rect x="22" y="11810" width="716" height="34" fill="rgb(11,3,3)" stroke="rgb(208,215,222)" stroke-width="1"/>
